name: Windows service build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25.x'
      - name: Verify dependencies and compile checks
        run: |
          go mod verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and package Windows service
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/payload | Out-Null
          go build -trimpath -o dist/payload/MrG.Daemon.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go version -m dist/payload/MrG.Daemon.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item README.md,config.json,comfyFlags.json dist/payload/
          Copy-Item subapplications.json dist/payload/subapplications.example.json
          '[]' | Set-Content dist/payload/subapplications.json
          $env:GITHUB_SHA | Set-Content dist/payload/BUILD-COMMIT.txt
          Compress-Archive dist/payload/* dist/MrG-Daemon-win-x64.zip
          "$( (Get-FileHash dist/MrG-Daemon-win-x64.zip).Hash.ToLowerInvariant() )  MrG-Daemon-win-x64.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MrG-Daemon-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
